name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json — the same pnpm
      # the Docker image uses, so the lockfile means the same thing everywhere.
      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      # Native modules (better-sqlite3, argon2, ssh2) compile here because
      # pnpm-workspace.yaml allows their build scripts.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API and web packages import from @skiff/shared's compiled output,
      # so it must be built before typecheck/tests run on a clean clone.
      - name: Build shared package
        run: pnpm --filter @skiff/shared build

      # Known-vulnerable production dependencies fail the build.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Typecheck
        run: pnpm typecheck

      - name: API integration tests
        run: pnpm --filter @skiff/api test

      - name: Build
        run: pnpm build

name: DCO

# Checks that every commit in a pull request carries a Signed-off-by line.
#
# This is the lightweight alternative to a Contributor License Agreement.
# There's nothing to sign and no document to store: adding `-s` to a commit
# asserts the Developer Certificate of Origin — that the contributor wrote the
# code, or has the right to submit it, and is contributing it under the
# project's license.
#
# Worth having before contributions pick up. Without a record of who agreed to
# what, anything that later needs contributors' consent means tracking every
# past contributor down individually.

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full range of commits in the PR, not just the tip.
          fetch-depth: 0

      - name: Check commits
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          missing=0

          while read -r sha; do
            [ -z "$sha" ] && continue
            # Merge commits are generated by GitHub, not written by a
            # contributor, so they aren't expected to be signed off.
            parents=$(git rev-list --parents -n 1 "$sha" | wc -w)
            if [ "$parents" -gt 2 ]; then continue; fi

            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "::error::Missing Signed-off-by on $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")

          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Fix this by re-committing with the -s flag:"
            echo "  git commit --amend -s        # for the most recent commit"
            echo "  git rebase --signoff $base   # for several commits"
            echo ""
            echo "See CONTRIBUTING.md for what signing off means."
            exit 1
          fi

          echo "All commits are signed off."

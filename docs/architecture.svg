<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Skiff architecture: browsers attach and detach from sessions that live in the Skiff server, which holds the SSH connections to your hosts" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L6.5,3.2 L0,6.4 Z" fill="#5A6472"/>
    </marker>
    <marker id="ab" markerWidth="8" markerHeight="8" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L6.5,3.2 L0,6.4 Z" fill="#4C8DFF"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L6.5,3.2 L0,6.4 Z" fill="#3FB950"/>
    </marker>
  </defs>

  <rect width="900" height="380" rx="10" fill="#0E1116"/>
  <rect width="900" height="380" rx="10" fill="none" stroke="#232A34"/>

  <!-- ─── column headings ─────────────────────────────────────────────── -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5A6472" letter-spacing="1.4">
    <text x="44" y="42">CLIENTS</text>
    <text x="330" y="42">YOUR SERVER</text>
    <text x="712" y="42">YOUR HOSTS</text>
  </g>

  <!-- ─── clients ─────────────────────────────────────────────────────── -->
  <!-- laptop, attached -->
  <g>
    <animate attributeName="opacity" values="1;1;0.32;0.32;1" keyTimes="0;0.30;0.38;0.62;0.70" dur="10s" repeatCount="indefinite"/>
    <rect x="44" y="64" width="176" height="70" rx="6" fill="#161B22" stroke="#232A34"/>
    <text x="62" y="90" font-family="Inter Tight, Helvetica, sans-serif" font-size="13" fill="#E6EAF0">Browser — laptop</text>
    <text x="62" y="110" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8B95A5">attached</text>
  </g>
  <circle cx="204" cy="106" r="3.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.30;0.36;0.62;0.68" dur="10s" repeatCount="indefinite"/>
  </circle>


  <!-- phone, attaches later -->
  <rect x="44" y="188" width="176" height="70" rx="6" fill="#161B22" stroke="#232A34"/>
  <text x="62" y="214" font-family="Inter Tight, Helvetica, sans-serif" font-size="13" fill="#E6EAF0">Browser — anywhere</text>
  <text x="62" y="234" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8B95A5">reattaches</text>
  <circle cx="204" cy="230" r="3.5" fill="#3FB950" opacity="0.15">
    <animate attributeName="opacity" values="0.15;0.15;1;1;0.15" keyTimes="0;0.62;0.70;0.94;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="204" cy="230" r="3.5" fill="none" stroke="#3FB950" stroke-width="1.5" opacity="0">
    <animate attributeName="r" values="3.5;16" keyTimes="0;1" dur="1.1s" begin="6.6s;16.6s;26.6s;36.6s;46.6s" fill="freeze"/>
    <animate attributeName="opacity" values="0.9;0" dur="1.1s" begin="6.6s;16.6s;26.6s;36.6s;46.6s"/>
  </circle>

  <text x="44" y="292" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5A6472">nothing installed</text>
  <text x="44" y="308" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5A6472">no credentials held here</text>

  <!-- attach / detach arrows -->
  <line x1="224" y1="99" x2="316" y2="99" stroke="#4C8DFF" stroke-width="1.6"
        stroke-dasharray="7 5" marker-end="url(#ab)">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0.10;0.10;1" keyTimes="0;0.30;0.38;0.62;0.70" dur="10s" repeatCount="indefinite"/>
  </line>
  <text x="238" y="90" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#5A6472">websocket</text>

  <line x1="224" y1="223" x2="316" y2="200" stroke="#4C8DFF" stroke-width="1.6"
        stroke-dasharray="7 5" marker-end="url(#ab)" opacity="0.10">
    <animate attributeName="stroke-dashoffset" values="24;0" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.10;0.10;1;1;0.10" keyTimes="0;0.62;0.70;0.94;1" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- ─── skiff server ────────────────────────────────────────────────── -->
  <rect x="322" y="64" width="270" height="260" rx="8" fill="#12161D" stroke="#2C3542"/>
  <text x="342" y="90" font-family="Inter Tight, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#4C8DFF">Skiff</text>
  <text x="342" y="108" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#5A6472">single binary + SQLite · docker compose</text>

  <!-- live sessions box: the point of the whole diagram -->
  <rect x="342" y="124" width="230" height="74" rx="6" fill="#0B0E13" stroke="rgba(63,185,80,0.35)"/>
  <text x="358" y="147" font-family="Inter Tight, Helvetica, sans-serif" font-size="12.5" fill="#E6EAF0">Live SSH sessions</text>
  <text x="358" y="166" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8B95A5">held here, not in the tab</text>
  <text x="358" y="183" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#3FB950">256 KB scrollback · 30 min idle grace</text>

  <!-- steady heartbeat: the session is alive the whole loop -->
  <circle cx="556" cy="141" r="3.5" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <rect x="342" y="210" width="110" height="46" rx="6" fill="#161B22" stroke="#232A34"/>
  <text x="356" y="230" font-family="Inter Tight, Helvetica, sans-serif" font-size="11.5" fill="#E6EAF0">Vault</text>
  <text x="356" y="246" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B95A5">AES-256-GCM</text>

  <rect x="462" y="210" width="110" height="46" rx="6" fill="#161B22" stroke="#232A34"/>
  <text x="476" y="230" font-family="Inter Tight, Helvetica, sans-serif" font-size="11.5" fill="#E6EAF0">Recorder</text>
  <text x="476" y="246" font-family="ui-monospace, Menlo, monospace" font-size="9" fill="#8B95A5">asciicast v2</text>

  <rect x="342" y="264" width="230" height="46" rx="6" fill="#161B22" stroke="#232A34"/>
  <text x="356" y="283" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8B95A5">audit log · team accounts</text>
  <text x="356" y="299" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#8B95A5">host fingerprint pinning</text>

  <!-- ─── hosts ───────────────────────────────────────────────────────── -->
  <line x1="600" y1="161" x2="700" y2="120" stroke="#6B7688" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></line>
  <line x1="600" y1="161" x2="700" y2="186" stroke="#6B7688" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></line>
  <line x1="600" y1="161" x2="700" y2="252" stroke="#6B7688" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#a)"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.6s" repeatCount="indefinite"/></line>
  <text x="622" y="138" font-family="ui-monospace, Menlo, monospace" font-size="9.5" fill="#5A6472">ssh</text>

  <g font-family="ui-monospace, Menlo, monospace" font-size="10.5">
    <rect x="706" y="98" width="150" height="42" rx="6" fill="#161B22" stroke="#232A34"/>
    <text x="722" y="124" fill="#E6EAF0">prod-web-01</text>

    <rect x="706" y="164" width="150" height="42" rx="6" fill="#161B22" stroke="#232A34"/>
    <text x="722" y="190" fill="#E6EAF0">prod-db-01</text>

    <rect x="706" y="230" width="150" height="42" rx="6" fill="#161B22" stroke="#232A34"/>
    <text x="722" y="256" fill="#E6EAF0">staging</text>
  </g>

  <text x="706" y="296" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5A6472">unchanged — no agent,</text>
  <text x="706" y="312" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#5A6472">no tmux, no config</text>

  <!-- ─── caption ─────────────────────────────────────────────────────── -->
  <line x1="44" y1="338" x2="856" y2="338" stroke="#232A34"/>
  <text x="44" y="360" font-family="Inter Tight, Helvetica, sans-serif" font-size="12" fill="#8B95A5">
    Browsers attach and detach. The session doesn't — it lives in the Skiff process until you return, or the idle timer reaps it.
  </text>
</svg>

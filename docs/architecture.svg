<svg xmlns="http://www.w3.org/2000/svg" width="900" height="354" viewBox="0 0 900 354" role="img" aria-labelledby="title desc"><title id="title">Your browser is the viewer. Your server holds the session and Memory.</title><desc id="desc">Browsers attach over WebSocket to the Skiff Node.js process. It holds live sessions and encrypted SQLite data, connecting to target hosts using SSH and SFTP without a target agent.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.muted{fill:#a4b3c7}.small{font-size:12px}.label{font-size:11px;letter-spacing:1.8px;fill:#9bb5d3}.flow{stroke-dasharray:6 6;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.focus{animation:focus 8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-48}}@keyframes pulse{50%{opacity:.45}}@keyframes focus{0%,100%{stroke:#315176}50%{stroke:#72b8ff}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.focus{animation:none}}</style>
<rect x="1" y="1" width="898" height="352" rx="16" fill="#0c121c" stroke="#26364c"/>
<text x="28" y="35" class="label">HOW IT WORKS / NO TARGET AGENT</text>
<text x="28" y="77" font-size="20" font-weight="700" fill="#eff5ff">Your browser is the viewer. Your server keeps the work.</text>
<rect x="28" y="113" width="192" height="175" rx="10" fill="#111c2b" stroke="#2c405b"/>
<text x="46" y="143" font-size="17" font-weight="700" fill="#e3eeff">Browser</text>
<text x="46" y="174" font-size="13" class="muted">Terminal · History · Notes</text>
<text x="46" y="205" font-size="12" fill="#72b8ff">Close / disconnect</text><text x="46" y="229" font-size="12" fill="#64d8ae">Return / reattach</text>
<text x="46" y="267" font-size="11" class="muted">UI served by your Skiff instance</text>
<path d="M229 196H312" stroke="#72b8ff" stroke-width="2" class="flow"/><text x="231" y="179" font-size="10" class="muted">WebSocket</text>
<rect x="322" y="113" width="290" height="175" rx="10" fill="#122138" stroke="#416187"/>
<text x="340" y="143" font-size="17" font-weight="700" fill="#e3eeff">Your Skiff server</text>
<text x="340" y="165" font-size="11" class="muted">Node.js · Docker optional</text>
<rect x="340" y="182" width="254" height="35" rx="5" fill="#0b161f" stroke="#315e52"/><circle cx="354" cy="199" r="4" fill="#64d8ae" class="pulse"/><text x="369" y="204" font-size="13" fill="#8be6bd">Live SSH sessions + scrollback</text>
<text x="340" y="244" font-size="13" fill="#c6dfff">Memory · vault · recordings</text>
<text x="340" y="267" font-size="11" class="muted">Encrypted content in local SQLite / files</text>
<path d="M620 196H693" stroke="#72b8ff" stroke-width="2" class="flow"/><text x="620" y="179" font-size="10" class="muted">SSH / SFTP</text>
<rect x="702" y="113" width="170" height="175" rx="10" fill="#111c2b" stroke="#2c405b"/>
<text x="720" y="143" font-size="17" font-weight="700" fill="#e3eeff">Your hosts</text>
<text x="720" y="179" font-size="12" class="mono" fill="#c6dfff">prod-web-01</text><text x="720" y="204" font-size="12" class="mono" fill="#c6dfff">prod-db-01</text><text x="720" y="229" font-size="12" class="mono" fill="#c6dfff">staging</text>
<text x="720" y="267" font-size="11" fill="#64d8ae">No Skiff agent installed</text>
<text x="28" y="325" font-size="12" class="muted">Live sessions end when Skiff restarts, the connection closes, or the detached-session idle grace expires.</text>
</svg>

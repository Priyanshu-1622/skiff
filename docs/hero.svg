<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Two browsers come and go while one unbroken SSH session lives inside Skiff, connected to your servers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- a little wobble so the strokes read as drawn rather than generated -->
    <filter id="ink" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="440" fill="#0B0E13"/>

  <g filter="url(#ink)" fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- ════ the two clients ════ -->

    <!-- upper browser: the one that gets closed -->
    <g id="tabA">
      <rect x="52" y="66" width="150" height="96" rx="8" stroke="#4C8DFF" stroke-width="3"/>
      <line x1="52" y1="92" x2="202" y2="92" stroke="#4C8DFF" stroke-width="3"/>
      <circle cx="68" cy="79" r="3.5" fill="#4C8DFF" stroke="none"/>
      <circle cx="80" cy="79" r="3.5" fill="#4C8DFF" stroke="none"/>
      <animate attributeName="opacity" values="1;1;0.18;0.18;1" keyTimes="0;0.26;0.34;0.72;0.80" dur="9s" repeatCount="indefinite"/>
    </g>
    <!-- the cross that lands when it closes -->
    <g stroke="#F85149" stroke-width="4" opacity="0">
      <line x1="98" y1="106" x2="156" y2="146"/>
      <line x1="156" y1="106" x2="98" y2="146"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.66;0.74;1" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- lower browser: the one you come back on -->
    <g id="tabB">
      <rect x="52" y="266" width="150" height="96" rx="8" stroke="#4C8DFF" stroke-width="3"/>
      <line x1="52" y1="292" x2="202" y2="292" stroke="#4C8DFF" stroke-width="3"/>
      <circle cx="68" cy="279" r="3.5" fill="#4C8DFF" stroke="none"/>
      <circle cx="80" cy="279" r="3.5" fill="#4C8DFF" stroke="none"/>
      <animate attributeName="opacity" values="0.18;0.18;1;1;0.18" keyTimes="0;0.66;0.76;0.94;1" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- ════ attach / detach: dashed, because clients are temporary ════ -->
    <path d="M206,114 C258,114 268,180 316,192" stroke="#4C8DFF" stroke-width="3" stroke-dasharray="9 8">
      <animate attributeName="stroke-dashoffset" values="34;0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0.10;0.10;1" keyTimes="0;0.26;0.34;0.74;0.82" dur="9s" repeatCount="indefinite"/>
    </path>
    <path d="M206,314 C258,314 268,240 316,228" stroke="#4C8DFF" stroke-width="3" stroke-dasharray="9 8" opacity="0.10">
      <animate attributeName="stroke-dashoffset" values="34;0" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.10;1;1;0.10" keyTimes="0;0.66;0.76;0.94;1" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- ════ skiff ════ -->
    <rect x="320" y="128" width="212" height="164" rx="10" stroke="#E6EAF0" stroke-width="3.5"/>

    <!-- the session: one unbroken solid line, never interrupted -->
    <rect x="348" y="192" width="156" height="52" rx="8" stroke="#3FB950" stroke-width="3.5" filter="url(#glow)"/>

    <!-- ════ the line that never breaks ════ -->
    <path d="M532,218 L700,218" stroke="#3FB950" stroke-width="4" filter="url(#glow)"/>

    <!-- ════ servers ════ -->
    <g stroke="#E6EAF0" stroke-width="3">
      <rect x="704" y="150" width="140" height="44" rx="6"/>
      <line x1="722" y1="172" x2="770" y2="172" stroke-width="4"/>
      <circle cx="822" cy="172" r="4" fill="#3FB950" stroke="none"/>

      <rect x="704" y="242" width="140" height="44" rx="6"/>
      <line x1="722" y1="264" x2="770" y2="264" stroke-width="4"/>
      <circle cx="822" cy="264" r="4" fill="#3FB950" stroke="none"/>
    </g>
    <path d="M700,218 L704,172 M700,218 L704,264" stroke="#3FB950" stroke-width="3"/>
  </g>

  <!-- ════ labels — few, large, monospace ════ -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700">
    <text x="127" y="196" text-anchor="middle" font-size="15" fill="#4C8DFF" letter-spacing="1.5">YOU</text>
    <text x="127" y="396" text-anchor="middle" font-size="15" fill="#4C8DFF" letter-spacing="1.5">YOU, LATER</text>
    <text x="426" y="118" text-anchor="middle" font-size="19" fill="#E6EAF0" letter-spacing="2.5">SKIFF</text>
    <text x="426" y="224" text-anchor="middle" font-size="16" fill="#3FB950" letter-spacing="1.8">SESSION</text>
    <text x="774" y="320" text-anchor="middle" font-size="15" fill="#E6EAF0" letter-spacing="1.5">YOUR SERVERS</text>

    <text x="127" y="222" text-anchor="middle" font-size="12" fill="#F85149" letter-spacing="1.2" opacity="0">
      TAB CLOSED
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.28;0.34;0.66;0.74;1" dur="9s" repeatCount="indefinite"/>
    </text>

    <text x="616" y="198" text-anchor="middle" font-size="12" fill="#3FB950" letter-spacing="1.2">STILL UP</text>
  </g>

  <text x="450" y="418" text-anchor="middle" font-family="Inter Tight, Helvetica, sans-serif" font-size="15" fill="#8B95A5">
    The browser is just a viewer. The session lives in Skiff, and keeps running without it.
  </text>
</svg>

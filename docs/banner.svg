<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190" role="img" aria-label="Skiff — your SSH session doesn't die with the browser tab" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161D"/>
      <stop offset="1" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4C8DFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="term">
      <rect x="468" y="30" width="376" height="130" rx="7"/>
    </clipPath>
  </defs>

  <rect width="880" height="190" rx="10" fill="url(#fade)"/>
  <rect width="880" height="190" rx="10" fill="none" stroke="#232A34"/>

  <!-- a slow accent sweep along the top edge; reads as "live" without shouting -->
  <rect x="0" y="0" width="240" height="2" fill="url(#sweep)">
    <animate attributeName="x" values="-240;880" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- mark -->
  <g transform="translate(52,30) scale(0.52)">
    <path d="M107,10 L107,30 L56,30 Z" fill="#4C8DFF"/>
    <path fill-rule="evenodd" d="M14,30 L156,30 L134,62 L36,62 Z M20,37.4 h130 v2 h-130 Z M27,47.4 h116 v2 h-116 Z" fill="#E6EAF0"/>
  </g>

  <text x="52" y="106" font-family="Inter Tight, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#E6EAF0" letter-spacing="-1.2">Skiff</text>
  <text x="52" y="134" font-family="Inter Tight, Helvetica, Arial, sans-serif" font-size="16" fill="#8B95A5">Your SSH session doesn't die with the browser tab.</text>
  <text x="52" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" fill="#5A6472">self-hosted · AGPL-3.0 · no cloud · no telemetry</text>

  <!-- terminal, showing the reattach it is actually about -->
  <rect x="468" y="30" width="376" height="130" rx="7" fill="#0B0E13" stroke="#232A34"/>
  <g clip-path="url(#term)">
    <rect x="468" y="30" width="376" height="26" fill="#12161D"/>
    <circle cx="484" cy="43" r="4" fill="#2A313B"/>
    <circle cx="498" cy="43" r="4" fill="#2A313B"/>
    <circle cx="512" cy="43" r="4" fill="#2A313B"/>
    <text x="532" y="47" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" fill="#5A6472">prod-web-01</text>

    <!-- "session alive" pip -->
    <circle cx="826" cy="43" r="3.5" fill="#3FB950">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
      <text x="484" y="80" fill="#8B95A5">$ htop</text>

      <text x="484" y="102" fill="#5A6472" opacity="0">
        tab closed
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.30;0.36;0.52;0.58;1" dur="6s" repeatCount="indefinite"/>
      </text>

      <text x="484" y="124" fill="#3FB950" opacity="0">
        reattached — session still running
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.60;0.66;0.94;1" dur="6s" repeatCount="indefinite"/>
      </text>

      <text x="484" y="146" fill="#E6EAF0" opacity="0">
        uptime 04:17:32
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.72;0.94;1" dur="6s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- cursor -->
    <rect x="528" y="71" width="7" height="13" fill="#4C8DFF">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- a couple of load bars that keep moving, so the frame is never static -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" fill="#5A6472">
      <text x="484" y="126">cpu</text>
      <text x="484" y="140">mem</text>
    </g>
    <rect x="512" y="118" width="60" height="7" rx="2" fill="#1B2028"/>
    <rect x="512" y="118" width="30" height="7" rx="2" fill="#3FB950">
      <animate attributeName="width" values="14;46;22;58;30;14" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="512" y="132" width="60" height="7" rx="2" fill="#1B2028"/>
    <rect x="512" y="132" width="36" height="7" rx="2" fill="#4C8DFF">
      <animate attributeName="width" values="34;38;33;41;36;34" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

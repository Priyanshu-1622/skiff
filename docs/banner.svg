<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc"><title id="title">Skiff — self-hosted SSH with a memory</title><desc id="desc">Search past commands, inspect file changes, and pick up a live session. Illustrated Memory search result.</desc><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace}.muted{fill:#a4b3c7}.small{font-size:12px}.label{font-size:11px;letter-spacing:1.8px;fill:#9bb5d3}.flow{stroke-dasharray:6 6;animation:flow 3s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.focus{animation:focus 8s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-48}}@keyframes pulse{50%{opacity:.45}}@keyframes focus{0%,100%{stroke:#315176}50%{stroke:#72b8ff}}@media(prefers-reduced-motion:reduce){.flow,.pulse,.focus{animation:none}}</style>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#142338"/><stop offset="1" stop-color="#0c121c"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#719bd4" stroke-opacity=".05"/></pattern></defs>
<rect x="1" y="1" width="898" height="298" rx="18" fill="url(#bg)" stroke="#2b3c54"/><rect x="1" y="1" width="898" height="298" rx="18" fill="url(#grid)"/>
<g transform="translate(38 28) scale(.27)"><path d="M107 10V30H56Z" fill="#72b8ff"/><path d="M14 30H156L134 62H36Z" fill="#eef5ff"/></g>
<text x="94" y="46" class="label">SELF-HOSTED SSH · OPEN SOURCE</text>
<text x="38" y="112" font-size="52" font-weight="700" letter-spacing="-2" fill="#f0f6ff">Skiff</text>
<text x="38" y="153" font-size="28" font-weight="700" fill="#d7e9ff">Self-hosted SSH</text>
<text x="38" y="186" font-size="16" class="muted">With a memory of your work.</text>
<text x="38" y="210" font-size="16" class="muted">Find the fix. Pick up where you left off.</text>
<rect x="38" y="241" width="132" height="26" rx="13" fill="#1b354c"/><text x="53" y="258" font-size="11" fill="#b5dfff">NO TARGET AGENT</text>
<text x="187" y="258" font-size="12" class="muted">Your server. Your history.</text>
<rect x="461" y="30" width="401" height="240" rx="12" fill="#0b121d" stroke="#314661"/>
<circle cx="483" cy="52" r="3" fill="#64d8ae" class="pulse"/><text x="496" y="56" class="label">MEMORY / ALL HOSTS</text>
<rect x="479" y="73" width="365" height="33" rx="6" fill="#142236" stroke="#304c70" class="focus"/>
<circle cx="497" cy="88" r="5" fill="none" stroke="#72b8ff" stroke-width="1.5"/><path d="m501 92 4 4" stroke="#72b8ff"/>
<text x="520" y="94" font-size="13" fill="#d5e8ff">nginx</text><text x="778" y="94" font-size="10" class="muted">SEARCH</text>
<text x="480" y="131" font-size="11" fill="#72b8ff">prod-web-01</text><text x="755" y="131" font-size="11" class="muted">LAST WEEK</text>
<text x="480" y="158" font-size="13" class="mono" fill="#eef5ff">$ sudo nginx -t</text>
<text x="480" y="181" font-size="12" class="mono" fill="#64d8ae">configuration file test is successful</text>
<path d="M479 199H844" stroke="#23334a"/>
<text x="480" y="222" font-size="13" fill="#d5e8ff">nginx.conf</text><text x="787" y="222" font-size="12" fill="#64d8ae">+1</text><text x="814" y="222" font-size="12" fill="#ff9f9f">−1</text>
<text x="480" y="246" font-size="11" class="muted">Command → output → file change</text>
</svg>
